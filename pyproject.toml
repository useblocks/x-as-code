[project]
name = "EAC"
version = "0.1.0"
description = "X-as-code showcase documentation"
authors = [
    { name = "Useblocks", email = "info@useblocks.com" }
]
dependencies = [
    "sphinx[test]>=8.2.3",
    "sphinx-needs[plotting]>=6.3.0",
    "sphinxcontrib-plantuml>=0.30",
    "sphinx_codelinks>=1.1.0",
    "sphinx-design>=0.6.1",
    "sphinx-simplepdf>=1.6.0",
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinx-test-reports>=1.3.2",
    "ubt-sphinx>=0.4.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["eac"]
